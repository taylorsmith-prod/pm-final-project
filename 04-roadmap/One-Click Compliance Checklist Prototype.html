<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One-Click Compliance Checklist Prototype</title>
<style>
:root{--bg:#EEF2F5;--sf:#fff;--ink:#13233A;--mut:#5A6B80;--line:#D3DCE5;--ok:#0E8A6B;--okbg:#DDF3EC;--bad:#C4471F;--badbg:#FBE5DC;--chg:#9A5B00;--chgbg:#FFF0D6;--btn:#13233A;--btnt:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A2A;--sf:#16263B;--ink:#E8EEF5;--mut:#9BAABB;--line:#2B3D55;--ok:#4CD1A8;--okbg:#12362F;--bad:#FF8A5E;--badbg:#4A2619;--chg:#FFC266;--chgbg:#40300F;--btn:#E8EEF5;--btnt:#13233A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A2A;--sf:#16263B;--ink:#E8EEF5;--mut:#9BAABB;--line:#2B3D55;--ok:#4CD1A8;--okbg:#12362F;--bad:#FF8A5E;--badbg:#4A2619;--chg:#FFC266;--chgbg:#40300F;--btn:#E8EEF5;--btnt:#13233A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:720px;margin:0 auto;padding:20px 16px 48px}
.bar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;color:var(--mut);font-size:13px}
.bar b{color:var(--ink);font-size:15px}
h1{font-size:26px;line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 18px;font-size:14px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.rid{font-weight:700}.mut{color:var(--mut);font-size:14px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #3B54C7;outline-offset:2px}
.primary{background:var(--btn);color:var(--btnt);border:0;border-radius:8px;padding:12px 20px;font-weight:700;min-height:44px}
.primary:disabled{opacity:.35;cursor:not-allowed}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 14px;min-height:40px}
.link{background:none;border:0;color:var(--mut);padding:0;margin-bottom:12px;text-decoration:underline}
.pill{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
.stats{display:flex;gap:12px;margin-bottom:18px}
.stat{flex:1;background:var(--sf);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat b{display:block;font-size:24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.grid{grid-template-columns:1fr}.stats{flex-direction:column}}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input{width:100%;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-height:44px}
input.err{border-color:var(--bad);background:var(--badbg)}
.tag{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px}
.tag.chg{background:var(--chgbg);color:var(--chg)}
.msg{font-size:12px;color:var(--bad);margin-top:4px}
.chk{padding:12px 0;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.tg{display:flex;gap:6px}
.tg button{border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:8px 16px;min-width:72px;min-height:44px;font-weight:700}
.tg button.p[aria-pressed="true"]{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tg button.f[aria-pressed="true"]{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.big{text-align:center;padding:28px 16px}
.big .ck{width:56px;height:56px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;font-size:30px;margin:0 auto 12px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px}
</style>
</head>
<body>
<div class="app" id="root"></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useRef}=React, h=React.createElement;
const BASELINE=876; // 14.6 min in seconds
const CHECKS=["Pre-trip vehicle inspection complete","Driver license valid","Hours-of-service within limit","Load secured and within weight limit","Permits and paperwork attached","Insurance current"];
const ROUTES=[
 {id:"R-1041",driver:"Maria Alvarez",vehicle:"TRK-218",at:"06:10"},
 {id:"R-1042",driver:"James Okafor",vehicle:"TRK-104",at:"06:25"},
 {id:"R-1043",driver:"Priya Nair",vehicle:"",at:"06:40"},
 {id:"R-1044",driver:"Tom Becker",vehicle:"VAN-072",at:"06:55"}];
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");

function List({logs,open}){
  const done=Object.values(logs), avg=done.length?Math.round(done.reduce((a,l)=>a+l.secs,0)/done.length):null;
  return h("div",null,
    h("h1",null,"Routes just assigned"),
    h("p",{className:"sub"},"Log compliance straight from the assignment. Each checklist opens pre-filled."),
    h("div",{className:"stats"},
      h("div",{className:"stat"},h("b",null,done.length+" of "+ROUTES.length),h("span",{className:"mut"},"routes logged")),
      h("div",{className:"stat"},h("b",null,avg===null?"–":fmt(avg)),h("span",{className:"mut"},"avg time per route (baseline "+fmt(BASELINE)+")"))),
    ROUTES.map(r=>h("div",{className:"card row",key:r.id},
      h("div",null,h("div",{className:"rid"},r.id),h("div",{className:"mut"},r.driver+", assigned "+r.at)),
      logs[r.id]?h("span",{className:"pill"},"Logged in "+fmt(logs[r.id].secs)):h("button",{className:"primary",onClick:()=>open(r.id)},"Log compliance"))));
}

function Form({route,onSubmit,onBack}){
  const [f,setF]=useState({driver:route.driver,vehicle:route.vehicle,at:route.at});
  const [res,setRes]=useState(CHECKS.map(()=>"pass"));
  const [why,setWhy]=useState(CHECKS.map(()=>""));
  const [t,setT]=useState(0);
  const start=useRef(Date.now()), sent=useRef(false);
  useEffect(()=>{const i=setInterval(()=>setT(Math.round((Date.now()-start.current)/1000)),1000);return()=>clearInterval(i)},[]);
  const F=[["driver","Driver"],["vehicle","Vehicle"],["at","Assigned at"]];
  const empty=F.filter(([k])=>!f[k].trim()).length;
  const noWhy=res.filter((r,i)=>r==="fail"&&!why[i].trim()).length;
  const issues=empty+noWhy;
  const set=(arr,fn,i,v)=>fn(arr.map((x,j)=>j===i?v:x));
  function submit(){
    if(sent.current||issues>0)return; sent.current=true;
    onSubmit({secs:Math.round((Date.now()-start.current)/1000),passed:res.filter(r=>r==="pass").length,failed:res.filter(r=>r==="fail").length});
  }
  return h("div",null,
    h("button",{className:"link",onClick:onBack},"Back to routes"),
    h("div",{className:"row"},h("h1",null,"Compliance check "+route.id),h("span",{className:"timer"},fmt(t))),
    h("p",{className:"sub"},"Pre-filled from route data. Confirm, edit anything that is wrong, then submit."),
    h("div",{className:"card"},h("div",{className:"grid"},F.map(([k,l])=>{
      const blank=!route[k], bad=!f[k].trim(), edited=!blank&&f[k]!==route[k];
      return h("div",{key:k},h("label",{htmlFor:k},l),
        h("input",{id:k,value:f[k],className:bad?"err":"",onChange:e=>setF({...f,[k]:e.target.value})}),
        bad&&h("div",{className:"msg"},blank?"Missing from route data. Enter it to continue.":"Required."),
        edited&&h("span",{className:"tag chg"},"Edited"));
    }))),
    h("div",{className:"card"},CHECKS.map((c,i)=>h("div",{className:"chk",key:i},
      h("div",{className:"row"},h("span",null,c),
        h("div",{className:"tg",role:"group","aria-label":c},
          h("button",{className:"p","aria-pressed":res[i]==="pass",onClick:()=>set(res,setRes,i,"pass")},"Pass"),
          h("button",{className:"f","aria-pressed":res[i]==="fail",onClick:()=>set(res,setRes,i,"fail")},"Fail"))),
      res[i]==="fail"&&h("div",{style:{marginTop:8}},
        h("input",{placeholder:"Reason for failure (required)","aria-label":"Reason for "+c,value:why[i],className:why[i].trim()?"":"err",onChange:e=>set(why,setWhy,i,e.target.value)}))))),
    h("div",{className:"foot"},
      h("span",{className:"mut"},issues?issues+(issues===1?" item needs":" items need")+" attention":"Ready to submit"),
      h("button",{className:"primary",disabled:issues>0,onClick:submit},"Submit compliance check")));
}

function Done({route,log,next,onNext,onList}){
  return h("div",{className:"card big"},
    h("div",{className:"ck","aria-hidden":"true"},"✓"),
    h("h1",null,"Compliance logged"),
    h("p",{className:"sub"},route.id+" for "+route.driver),
    h("div",{className:"stats"},
      h("div",{className:"stat"},h("b",null,log.passed),h("span",{className:"mut"},"passed")),
      h("div",{className:"stat"},h("b",null,log.failed),h("span",{className:"mut"},"failed")),
      h("div",{className:"stat"},h("b",null,fmt(log.secs)),h("span",{className:"mut"},"time taken"))),
    next?h("button",{className:"primary",onClick:onNext},"Next unlogged route: "+next.id):h("button",{className:"primary",onClick:onList},"Back to routes"),
    next&&h("div",{style:{marginTop:12}},h("button",{className:"ghost",onClick:onList},"Back to routes")));
}

function App(){
  const [screen,setScreen]=useState("list"), [id,setId]=useState(null), [logs,setLogs]=useState({});
  const route=ROUTES.find(r=>r.id===id);
  const nextOf=l=>ROUTES.find(r=>!l[r.id]);
  const open=i=>{setId(i);setScreen("form")};
  return h("div",null,
    h("div",{className:"bar"},h("b",null,"RouteLogic Velocity"),h("span",null,"Prototype with mock data")),
    screen==="list"&&h(List,{logs,open}),
    screen==="form"&&h(Form,{key:id,route,onBack:()=>setScreen("list"),onSubmit:r=>{setLogs({...logs,[id]:r});setScreen("done")}}),
    screen==="done"&&h(Done,{route,log:logs[id],next:nextOf(logs),onNext:()=>open(nextOf(logs).id),onList:()=>setScreen("list")}));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
